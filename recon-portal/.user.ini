; =============================================================
; .user.ini — Raises upload limits for the reconciliation form.
;
; Picked up automatically by PHP-FPM / CGI SAPIs (the standard
; setup on current cPanel "MultiPHP" accounts) for this directory
; and everything under it. Changes can take up to 5 minutes to
; take effect (PHP's user_ini.cache_ttl) — a Passenger/PHP-FPM
; restart is not required, just a short wait.
;
; If this account instead runs PHP as an Apache module (mod_php /
; "DSO"), .user.ini is ignored entirely — set the same values via
; .htaccess (php_value) or cPanel's MultiPHP INI Editor instead.
;
; Real Client Data spreadsheets seen so far are ~1-2 MB, so this
; ceiling leaves well over 100x headroom.
; =============================================================

upload_max_filesize = 250M
post_max_size = 1024M
max_execution_time = 600
max_input_time = 600
